  critical:
    recipients:
      - name: "Project Manager"
        email: "pm@project.com.australia"
        phone: "+61 2 9876 5432"
      - name: "JV Committee Chair"
        email: "chair@jv-committee.australia"
        phone: "+61 2 8765 4321"
    response_time: "2 hours"
  
  major:
    recipients:
      - name: "Cost Controller"
        email: "cost.controller@project.com.australia"
        phone: "+61 2 6789 0123"
      - name: "Partner Liaison Officer"
        email: "plo@project.com.australia"
        phone: "+61 2 5678 9012"
    response_time: "24 hours"
  
  minor:
    recipients:
      - name: "HR Manager - BYCA"
        email: "hr.byca@byca.australia.com"
        phone: "+61 2 2345 6789"
      - name: "HR Manager - JHG"
        email: "hr.jhg@jhg.australia.com"
        phone: "+61 3 3456 7890"
    response_time: "72 hours"

discrepancy_types:
  ghost_worker:
    escalation_level: "critical"
    responsible_party: "Both Partners"
    notes: "Verify staff authenticity immediately"
  
  name_typo:
    escalation_level: "major"
    responsible_party: "Source Partner"
    notes: "Cross-check with official documents"
  
  rate_variance:
    escalation_level: "major"
    responsible_party: "Both Partners"
    notes: "Review rate agreements and contracts"
  
  missing_document:
    escalation_level: "critical"
    responsible_party: "Source Partner"
    notes: "Request immediate documentation"
  
  duplicate_entry:
    escalation_level: "minor"
    responsible_party: "Data Entry Team"
    notes: "Clean up duplicate records"
  
  compliance_violation:
    escalation_level: "critical"
    responsible_party: "Legal & Compliance Team"
    notes: "Immediate attention required for Australian Fair Work Ombudsman compliance"

