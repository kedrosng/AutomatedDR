# Partner configuration for JV Cost Control System
# Defines metadata and file patterns for each partner

partners:
  byca:
    name: "Bouygues Construction Australia"
    short_name: "BYCA"
    file_patterns:
      hr_master: ["hr_master.csv", "staff_master.csv", "employees.csv"]
      tfr_timesheet: ["tfr_*.pdf", "timesheet_*.pdf", "daily_report_*.pdf"]
      site_attendance: ["site_attendance.xlsx", "attendance_log.xlsx", "work_log.xlsx"]
    column_mappings:
      staff_id: ["Staff_ID", "StaffID", "Employee_ID", "Emp_ID"]
      name: ["Full_Name", "Name", "Employee_Name", "Staff_Name"]
      role: ["Role", "Position", "Job_Title", "Designation"]
      rate: ["Hourly_Rate", "Daily_Rate", "Wage", "Rate_AUD"]
      work_permit: ["Work_Permit", "Visa_Number", "Permit_No", "Visa_Permit"]
    contact:
      manager: "Robert Johnson"
      email: "robert.johnson@byca.australia.com"
      phone: "+61 2 9876 5432"

  jhg:
    name: "John Holland Group"
    short_name: "JHG"
    file_patterns:
      hr_master: ["hr_master.csv", "staff_master.csv", "employees.csv"]
      tfr_timesheet: ["tfr_*.pdf", "timesheet_*.pdf", "daily_report_*.pdf"]
      site_attendance: ["site_attendance.xlsx", "attendance_log.xlsx", "work_log.xlsx"]
    column_mappings:
      staff_id: ["Employee_No", "Emp_No", "Staff_ID", "ID"]
      name: ["Name", "Full_Name", "Employee_Name", "Staff_Name"]
      role: ["Role", "Position", "Job_Title", "Designation", "Position_Title"]
      rate: ["Hourly_Rate", "Daily_Rate", "Wage", "Rate_AUD"]
      work_permit: ["Work_Permit", "Visa_Number", "Permit_No", "Visa_Permit"]
    contact:
      manager: "Emma Thompson"
      email: "emma.thompson@jhg.australia.com"
      phone: "+61 3 8765 4321"

